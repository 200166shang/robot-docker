services:
  base:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ros:jazzy-ros-base}
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        SOURCE_MODE: ${SOURCE_MODE:-official}
        UBUNTU_MIRROR_AMD64: ${UBUNTU_MIRROR_AMD64:-}
        UBUNTU_MIRROR_ARM64: ${UBUNTU_MIRROR_ARM64:-}
        ROS_APT_MIRROR: ${ROS_APT_MIRROR:-}
        ROSDISTRO_INDEX_URL: ${ROSDISTRO_INDEX_URL:-}
        ROSDEP_SOURCE_MIRROR: ${ROSDEP_SOURCE_MIRROR:-}
    image: ${IMAGE_NAME:-robot-docker:jazzy-base}
    init: true
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    working_dir: /workspace
    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:-.}
        target: /workspace

  sim:
    build:
      context: .
      dockerfile: Dockerfile.sim
      args:
        BASE_IMAGE: ${IMAGE_NAME:-robot-docker:jazzy-base}
    image: ${SIM_IMAGE_NAME:-robot-docker:jazzy-sim}
    init: true
    stdin_open: true
    tty: true
    command: ["sleep", "infinity"]
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      DISPLAY: ":0"
      ROBOT_DOCKER_VNC_PORT: ${ROBOT_DOCKER_VNC_PORT:-5900}
      ROBOT_DOCKER_DISPLAY_GEOMETRY: ${ROBOT_DOCKER_DISPLAY_GEOMETRY:-1280x800x24}
    working_dir: /workspace
    shm_size: 1gb
    expose:
      - "${ROBOT_DOCKER_VNC_PORT:-5900}"
    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:-.}
        target: /workspace
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          source /usr/local/lib/robot-docker-sim-display-utils.sh &&
          robot_docker_sim_vnc_port_is_listening "${ROBOT_DOCKER_VNC_PORT:-5900}"
      interval: 2s
      timeout: 1s
      retries: 30
      start_period: 2s

  novnc:
    image: bonigarcia/novnc:1.3.0@sha256:a5be468dc8967a55ffe870e809fa36dbbfc19b67d8156c1e7cb2d26aaa4f32c2
    platform: linux/amd64
    depends_on:
      sim:
        condition: service_healthy
    environment:
      AUTOCONNECT: "true"
      VNC_SERVER: sim:${ROBOT_DOCKER_VNC_PORT:-5900}
    ports:
      - "127.0.0.1:${ROBOT_DOCKER_NOVNC_PORT:-6080}:6080"
